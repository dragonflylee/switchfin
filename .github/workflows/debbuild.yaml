name: build-docker

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { img: ubuntu, tag: focal, file: debian/Dockerfile.focal }
        - { img: ubuntu, tag: noble }
        - { img: debian, tag: bookworm, file: debian/Dockerfile.bookworm }
        tag: [ focal, noble, bookworm ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: debian
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: debian
        file: ${{ matrix.file }}
        push: true
        provenance: false
        platforms: linux/amd64,linux/arm64
        tags: ghcr.io/${{ github.repository_owner }}/build:${{ matrix.img }}-${{ matrix.tag }}
        build-args: |
          IMG=${{ matrix.img }}
          TAG=${{ matrix.tag }}